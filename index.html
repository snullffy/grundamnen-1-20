<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F4" />
  <title>Grundämnen 1–20 · Träna inför läxförhöret</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header -->
  <header id="topbar" class="topbar hidden">
    <div class="topbar-inner">
      <button class="brand" id="homeBtn" aria-label="Till startsidan">
        <span class="brand-mark">Gä</span>
        <span class="brand-name">Grundämnen</span>
      </button>
      <div class="ledger" role="group" aria-label="Statistik">
        <span class="led"><i>Nivå</i><b id="tbLevel">1</b></span>
        <span class="led"><i>XP</i><b id="tbXp">0</b></span>
        <span class="led hot"><i>Streak</i><b id="tbStreak">0</b></span>
      </div>
      <button class="mast-link" id="themeBtn" aria-label="Växla mellan ljust och mörkt">Tema</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Toast / floating feedback -->
  <div id="toast" class="toast"></div>
  <div id="xpFloat" class="xp-float"></div>

  <!-- Confetti canvas -->
  <canvas id="confetti" class="confetti"></canvas>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
