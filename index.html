<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F0" />
  <title>Grundämnen Nº 01–20 · Läxförhörsdossier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Masthead -->
  <header id="topbar" class="masthead hidden">
    <button class="mast-link" id="backBtn" aria-label="Tillbaka till index">← Index</button>
    <div class="ledger" role="group" aria-label="Statistik">
      <span class="led"><i>Nivå</i><b id="tbLevel">1</b></span>
      <span class="led"><i>XP</i><b id="tbXp">0</b></span>
      <span class="led hot"><i>Streak</i><b id="tbStreak">0</b></span>
    </div>
    <button class="mast-link" id="themeBtn" aria-label="Växla mörkt/ljust läge">◐ Läge</button>
    <button class="mast-link" id="homeBtn" aria-label="Hem">Hem</button>
  </header>

  <main id="app"></main>

  <!-- Toast / floating feedback -->
  <div id="toast" class="toast"></div>
  <div id="xpFloat" class="xp-float"></div>

  <!-- Confetti canvas -->
  <canvas id="confetti" class="confetti"></canvas>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
